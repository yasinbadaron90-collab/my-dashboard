<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>YB Quick Add</title>
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#0a0a0a;color:#efefef;font-family:'DM Mono',ui-monospace,Menlo,monospace;padding:20px 16px 40px;max-width:480px;margin:0 auto;}
  h1{font-family:Syne,system-ui,sans-serif;font-weight:800;font-size:20px;margin:0 0 4px;}
  h1 span{color:#c8f230;}
  .sub{font-size:11px;color:#888;letter-spacing:1px;margin-bottom:20px;}
  .types{display:flex;gap:8px;margin-bottom:14px;}
  .types button{flex:1;padding:14px 4px;border-radius:12px;border:1px solid #2a2a2a;background:#1a1a1a;color:#888;font:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;}
  .types button.on{background:#c8f230;border-color:#c8f230;color:#000;font-weight:700;}
  input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;color:#efefef;font:inherit;padding:14px;margin-bottom:10px;}
  #amt{font-family:Syne,system-ui,sans-serif;font-weight:800;font-size:32px;text-align:center;}
  #save{width:100%;padding:16px;border-radius:12px;border:none;background:#c8f230;color:#000;font-family:Syne,system-ui,sans-serif;font-weight:800;font-size:15px;letter-spacing:1px;cursor:pointer;}
  #msg{min-height:18px;font-size:12px;color:#c8f230;margin:10px 0;text-align:center;}
  #msg.err{color:#f23060;}
  .lbl{font-size:10px;color:#888;letter-spacing:2px;text-transform:uppercase;margin:22px 0 8px;}
  .row{display:flex;align-items:center;gap:10px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin-bottom:8px;font-size:12px;}
  .row b{font-family:Syne,system-ui,sans-serif;font-size:15px;}
  .row .n{flex:1;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row button{background:none;border:1px solid #333;border-radius:8px;color:#888;padding:6px 10px;font:inherit;cursor:pointer;}
  a{display:block;text-align:center;color:#c8f230;font-size:12px;letter-spacing:1px;margin-top:24px;text-decoration:none;border:1px solid #2a3a00;border-radius:12px;padding:14px;}
</style>
</head>
<body>
<h1>YB <span>Quick Add</span></h1>
<div class="sub">Jot it now. Finish it in the dashboard.</div>

<div class="types" id="types">
  <button data-t="spend" class="on">↑ Spend</button>
  <button data-t="move">🔄 Move</button>
  <button data-t="moneyin">↓ Money in</button>
</div>
<input id="amt" type="number" step="0.01" inputmode="decimal" placeholder="R 0" aria-label="Amount in rand">
<input id="note" type="text" placeholder="What was it? e.g. petrol" aria-label="Note">
<button id="save">Save note</button>
<div id="msg" role="status"></div>

<div class="lbl" id="waitLbl"></div>
<div id="list"></div>
<a href="./">Open dashboard</a>

<script>
// Quick Add writes ONLY to the inbox key. It never touches pockets, Cash Flow
// or banks: the dashboard turns each note into a real entry with its own forms.
var KEY = 'yb_inbox_v1', type = 'spend';
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch(e){ return []; } }
function store(a){ localStorage.setItem(KEY, JSON.stringify(a)); }
function today(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ return 'R' + Number(n).toLocaleString('en-ZA', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2}); }
var NAMES = { spend:'Spend', move:'Move', moneyin:'Money in' };

function render(){
  var a = load();
  document.getElementById('waitLbl').textContent = a.length ? a.length + ' waiting for the dashboard' : '';
  document.getElementById('list').innerHTML = a.map(function(e){
    return '<div class="row"><b>'+fmt(e.amount)+'</b><span class="n">'+NAMES[e.type]+(e.note ? ' · '+esc(e.note) : '')+'</span><button data-del="'+esc(e.id)+'" aria-label="Delete note">✕</button></div>';
  }).join('');
}
document.getElementById('types').addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(!b) return;
  type = b.dataset.t;
  [].forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); });
});
document.getElementById('list').addEventListener('click', function(ev){
  var b = ev.target.closest('[data-del]'); if(!b) return;
  store(load().filter(function(e){ return e.id !== b.dataset.del; })); render();
});
document.getElementById('save').addEventListener('click', function(){
  var msg = document.getElementById('msg'), amtEl = document.getElementById('amt'), noteEl = document.getElementById('note');
  var amt = Math.round(parseFloat(amtEl.value) * 100) / 100;
  if(!(amt > 0)){ msg.className = 'err'; msg.textContent = 'Enter an amount first.'; return; }
  var a = load();
  a.push({ id:'qa_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), type:type, amount:amt, note:noteEl.value.trim(), date:today(), createdAt:new Date().toISOString() });
  try { store(a); } catch(e){ msg.className = 'err'; msg.textContent = 'Could not save on this phone.'; return; }
  msg.className = ''; msg.textContent = 'Saved ' + fmt(amt) + '. It is waiting in the dashboard.';
  amtEl.value = ''; noteEl.value = ''; amtEl.focus(); render();
});
document.getElementById('amt').addEventListener('input', function(){ document.getElementById('msg').textContent = ''; });
render();
</script>
</body>
</html>
